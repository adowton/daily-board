[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Single-page app: any non-function path falls back to index.html.
# Requests to /.netlify/functions/* are routed to Functions before
# redirects are evaluated, so this catch-all won't intercept them.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
